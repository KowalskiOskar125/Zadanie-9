
<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Zadania JavaScript</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <h1>Zadania JavaScript</h1>

    <div class="zadanie">
        <h2>1. SUMA</h2>
        <input type="number" id="suma1" placeholder="Pierwsza liczba">
        <input type="number" id="suma2" placeholder="Druga liczba">
        <p id="wynikSuma"></p>
    </div>

    <div class="zadanie">
        <h2>2. PODSTAWY</h2>
        <input type="number" id="pod1" placeholder="Pierwsza liczba">
        <input type="number" id="pod2" placeholder="Druga liczba">
        <p id="wynikPodstawy"></p>
    </div>

    <div class="zadanie">
        <h2>3. KALKULATOR</h2>
        <input type="number" id="kal1" placeholder="Pierwsza liczba">
        <input type="number" id="kal2" placeholder="Druga liczba">

        <select id="dzialanie">
            <option value="+">Suma</option>
            <option value="-">Różnica</option>
            <option value="*">Iloczyn</option>
            <option value="/">Iloraz</option>
        </select>

        <p id="wynik"></p>
    </div>

    <div class="zadanie">
        <h2>4. MAKS</h2>
        <input type="number" id="maks1" placeholder="Pierwsza liczba">
        <input type="number" id="maks2" placeholder="Druga liczba">
        <input type="number" id="maks3" placeholder="Trzecia liczba">
        <p id="wynikMaks"></p>
    </div>

    <div class="zadanie">
        <h2>5. WZROST</h2>
        <input type="number" id="wzrost" placeholder="Podaj wzrost w cm">
        <p id="wynikWzrost"></p>
    </div>

    <div class="zadanie">
        <h2>6. BMI</h2>
        <input type="number" id="bmiWzrost" placeholder="Wzrost w cm">
        <input type="number" id="bmiWaga" placeholder="Waga w kg">
        <p id="wynikBMI"></p>
    </div>

    <div class="zadanie">
        <h2>7. STARSZY</h2>
        <label>Data urodzenia pierwszej osoby:</label>
        <input type="date" id="data1">

        <label>Data urodzenia drugiej osoby:</label>
        <input type="date" id="data2">

        <p id="wynikStarszy"></p>
    </div>

    <div class="zadanie">
        <h2>8. PRZESTEPNY</h2>
        <input type="number" id="rok" placeholder="Podaj rok">
        <p id="wynikRok"></p>
    </div>

    <div class="zadanie">
        <h2>9. SIŁA HASŁA</h2>
        <input type="password" id="haslo" placeholder="Wpisz hasło">
        <p id="komunikat"></p>
    </div>

    <div class="zadanie">
        <h2>10. TROJKAT</h2>
        <input type="number" id="bok1" placeholder="Pierwszy bok">
        <input type="number" id="bok2" placeholder="Drugi bok">
        <input type="number" id="bok3" placeholder="Trzeci bok">
        <p id="wynikTrojkat"></p>
    </div>

    <div class="zadanie">
        <h2>11. SZYFR</h2>
        <div class="szyfr">
            <input type="text" id="tekst" placeholder="Wpisz tekst">
            <p id="zaszyfrowany"></p>
        </div>
    </div>

    <script src="main.js"></script>

</body>
</html>
